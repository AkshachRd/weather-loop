name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build macOS app
    runs-on: macos-14

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Build WeatherLoop
        run: zsh build.sh

      - name: Verify app bundle
        run: |
          plutil -lint WeatherLoop.app/Contents/Info.plist
          plutil -lint WeatherLoop.app/Contents/Resources/en.lproj/Localizable.strings
          plutil -lint WeatherLoop.app/Contents/Resources/ru.lproj/Localizable.strings
          plutil -lint WeatherLoop.app/Contents/Resources/en.lproj/InfoPlist.strings
          plutil -lint WeatherLoop.app/Contents/Resources/ru.lproj/InfoPlist.strings
          test -x WeatherLoop.app/Contents/MacOS/WeatherLoop
